syntax = "proto3";

package auth.v1;

option go_package = "github.com/longdaica/my-app/backend/gen/auth/v1;authv1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterRequest{
  string email = 1;
  string password = 2;
  string confirm_password = 3;
  string name = 4;
}

message RegisterResponse{
  string message = 1;
}

message LoginRequest{
  string email = 1;
  string password = 2;
}

message LoginResponse{
  string token = 1;
}

version: v1
plugins:
  # GOLANG BE
  # Thợ xây Protobuf
  - plugin: go
    out: ../backend/gen
    opt: paths=source_relative

  # Thợ xây ConnectRPC
  - plugin: connect-go
    out: ../backend/gen
    opt: paths=source_relative

  #=========== TYPESCRIPT FE ============
  - plugin: buf.build/bufbuild/es:v1.10.0
    out: ../frontend/src/gen
    opt: target=ts,import_extension=none
  - plugin: buf.build/connectrpc/es:v1.4.0
    out: ../frontend/src/gen
    opt: target=ts,import_extension=none
